# ---------------------------------------------------------------------------
# 复合动作：安装并定位 MSYS2 UCRT64 工具链（g++ / windres / ninja / objdump）
#
# 为什么抽成 action：
#   · 安装包清单原先在多个 job 里各写一份，"改一处要同步另一处"——这种重复迟早会漂；
#   · 「别猜 MSYS2 装在哪」的候选路径逻辑有 60 行，原先在 build / package 两个 job 里**逐字重复**。
#   现在两件事都只有这一份。
#
# 前置条件：调用方必须先 actions/checkout（本地 action 要靠工作区里的文件）。
#
# 副作用（后续步骤直接用，不必再传参）
#   · UCRT64_BIN 写入 $GITHUB_ENV
#   · 该目录写入 $GITHUB_PATH（objdump 也要在 PATH 上，构建期的导出表校验依赖它）
# ---------------------------------------------------------------------------
name: 安装并定位 UCRT64 工具链
description: setup-msys2 + 找到含 g++.exe 与 ninja.exe 的 ucrt64/bin，导出 UCRT64_BIN 并加进 PATH

outputs:
  ucrt64-bin:
    description: 找到的 ucrt64/bin 绝对路径（同时已写入 UCRT64_BIN 环境变量）
    value: ${{ steps.locate.outputs.bin }}

runs:
  using: composite
  steps:
    - name: 安装 MSYS2 UCRT64 工具链
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: false
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-binutils
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja

    - name: 定位 UCRT64 工具链
      id: locate
      shell: pwsh
      env:
        MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
      run: |
        $ErrorActionPreference = 'Stop'
        $cands = New-Object System.Collections.Generic.List[string]
        # ★ 先信 setup-msys2 自己的输出（它默认**不**把工具加进 PATH，别猜盘符）
        if ($env:MSYS2_LOCATION) { $cands.Add("$env:MSYS2_LOCATION/ucrt64/bin") }
        foreach ($root in @($env:MSYS2_ROOT, $env:MSYS2_ROOT_HINT, "$env:RUNNER_TEMP/msys64", 'C:/msys64', 'D:/msys64')) {
          if ([string]::IsNullOrWhiteSpace($root)) { continue }
          $cands.Add("$root/ucrt64/bin")
        }
        foreach ($tool in @('g++.exe', 'ninja.exe')) {
          $c = Get-Command $tool -ErrorAction SilentlyContinue
          if ($c -and $c.Source) { $cands.Add((Split-Path -Parent $c.Source)) }
        }
        foreach ($root in @($env:RUNNER_TEMP, 'C:/', 'D:/')) {
          if ([string]::IsNullOrWhiteSpace($root)) { continue }
          if (-not (Test-Path $root)) { continue }
          Get-ChildItem -Path $root -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like '*msys*' } |
            ForEach-Object { $cands.Add((Join-Path $_.FullName 'ucrt64/bin')) }
        }

        $bin = $null
        foreach ($c in $cands) {
          if ([string]::IsNullOrWhiteSpace($c)) { continue }
          $c = $c.Replace('\', '/')
          if ((Test-Path (Join-Path $c 'g++.exe')) -and (Test-Path (Join-Path $c 'ninja.exe'))) {
            $bin = $c
            break
          }
        }
        if (-not $bin) {
          throw "找不到 UCRT64 工具链（需要 g++.exe 与 ninja.exe）。试过：$($cands -join ' | ')"
        }
        Add-Content -Path $env:GITHUB_ENV  -Value "UCRT64_BIN=$bin"
        Add-Content -Path $env:GITHUB_PATH -Value $bin
        Add-Content -Path $env:GITHUB_OUTPUT -Value "bin=$bin"
        "UCRT64_BIN=$bin"
        $gxx = & (Join-Path $bin 'g++.exe') --version
        "g++: $($gxx[0])"
        $LASTEXITCODE = 0
