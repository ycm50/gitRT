# ---------------------------------------------------------------------------
# GitRT 构建 / 测试 / 打包（GitHub Actions）
#
#   与本地完全同一套流程（README「快速开始」「测试」）：
#     · MSYS2 UCRT64 工具链（g++ / windres / ninja / objdump）—— 只在 build job 装
#     · Debug + Release 两个配置都构建
#     · CTest（3 个用例：core_selftest / gui_selftest / shell_selftest）+ Shell 探针菜单 dump
#     · 功能套件（远端与还原 / 合并提交 / 克隆选项 / 标签与发布）—— 纯 CLI + 真 git；
#       只在 Release 那一路跑（与构建类型无关，跑两遍只是重复最慢的一段）
#     · package job **复用 build job 的 Release 产物**（不再重装工具链、不再重建），
#       只做"组装发布目录 + install/uninstall 端到端"（packaging/scripts/build-release.ps1）
#     · **纯手动触发**（workflow_dispatch）：push / PR 都不自动跑
#     · 手动触发时填 tag 号 → 构建全部成功后创建/覆盖该 tag 与 GitHub Release
#
#   ★ 文档体检（tools/check-docs.py）**只在本机跑，不进 CI**：它要打印中文，
#     而 runner 的 stdout 是西文代码页 → UnicodeEncodeError 让步骤 10 秒失败
#     （本机是 GBK 所以照过；`python -X utf8 tools/check-docs.py` 可修，见 改进规划 §16）。
#
#   ★ CI 踩过的坑（见 docs/技术实现设计.md 偏差 30）：
#     1) **不要**把原生命令接进 `Select-Object -First N`：管道被提前关闭会让
#        g++/cmake 被杀、退出码非 0；GitHub 的 pwsh 包装器把 $LASTEXITCODE 当步骤
#        退出码 → 步骤直接失败。要先取到变量再截行，并在步骤末尾 $LASTEXITCODE = 0。
#     2) **别猜 MSYS2 装在哪**：setup-msys2 有官方 output `msys2-location`，用它；
#        它默认**不**把工具加进 PATH，所以后面统一用 $env:UCRT64_BIN 的绝对路径。
#     3) 纯诊断步骤一律 `continue-on-error: true`。
#     4) **别在多个 job 里复制同一段脚本**：安装清单与「定位 UCRT64 工具链」现在都只在
#        .github/actions/setup-ucrt64 里（复合动作，build 与 package 共用）。
#
#   注意：需要"注册身份包"的端到端用例（tools/test-all.ps1 的 D 阶段、现代菜单聚合）
#   依赖本机的开发者模式 + 交互式桌面会话，CI 里不跑；它们在本地按 README 的
#   「界面级验证」一节执行。
# ---------------------------------------------------------------------------
name: build

# ★ 只允许**手动触发**（用户要求）：push / pull_request 都不再自动跑。
#   理由：这个 workflow 的终点是"创建 GitHub Release"，而发布是产品决策——
#   不该因为推了一次代码就自动发版。想构建就手动点一次，顺便由你决定 tag 号。
on:
  workflow_dispatch:
    inputs:
      # 手动触发时**必须**输入 tag 号：本项目现在只有"手动 + 填 tag"这一条发布路径。
      # tag 号是产品版本决策，不由 CI 猜。
      tag:
        description: '要发布的 tag 号（例如 v0.2.0）。已存在则覆盖。'
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: write        # 打 tag 时需要创建 Release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 仅作为"候选路径"之一；真正的工具链目录由「定位 UCRT64 工具链」步骤决定
  MSYS2_ROOT_HINT: C:/msys64

jobs:
  build:
    name: build (${{ matrix.config }})
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v5

      # 装工具链 + 定位 ucrt64/bin 都在这一个复合动作里（安装清单与候选路径逻辑各只有一份）
      - uses: ./.github/actions/setup-ucrt64

      # 纯诊断：打印版本，出错也不该让构建挂（continue-on-error）
      - name: 显示工具链版本
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # ★ 先取到变量再截行：直接 `| Select-Object -First 1` 会提前关管道，
          #   原生命令被杀 → 非 0 退出 → GitHub 的 pwsh 包装器把步骤判失败（踩过）
          $gxx = & (Join-Path $env:UCRT64_BIN 'g++.exe') --version 2>&1
          "g++   : $($gxx | Select-Object -First 1)"
          $cm = & cmake --version 2>&1
          "cmake : $($cm | Select-Object -First 1)"
          $nj = & (Join-Path $env:UCRT64_BIN 'ninja.exe') --version 2>&1
          "ninja : $($nj | Select-Object -First 1)"
          $od = & (Join-Path $env:UCRT64_BIN 'objdump.exe') --version 2>&1
          "objdump: $($od | Select-Object -First 1)"
          $LASTEXITCODE = 0

      # ---- ccache：编译缓存（Windows C++ 构建提速的主要手段）----
      # 为什么要单独一步：CCACHE_DIR 必须在**配置之前**确定，且要把上一次的缓存恢复进来；
      # 否则每个 run 都是全量编译。key 里带配置名，Debug / Release 各存一份（产物不同，不能混用）。
      - name: 恢复 ccache（${{ matrix.config }}）
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ runner.os }}-ucrt64-${{ matrix.config }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-ucrt64-${{ matrix.config }}-
            ccache-${{ runner.os }}-ucrt64-

      - name: 配置 ccache 环境
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ccacheDir = Join-Path $env:RUNNER_TEMP 'ccache'
          New-Item -ItemType Directory -Force -Path $ccacheDir | Out-Null
          # 写入 GITHUB_ENV 供后续所有步骤使用（含 cmake 配置与构建）
          Add-Content -Path $env:GITHUB_ENV -Value "CCACHE_DIR=$ccacheDir"
          # 压缩存储：缓存体积显著变小，跨 run 传输更快（代价是命中时多一点解压时间）
          Add-Content -Path $env:GITHUB_ENV -Value "CCACHE_COMPRESS=true"
          Add-Content -Path $env:GITHUB_ENV -Value "CCACHE_COMPRESSLEVEL=6"
          Add-Content -Path $env:GITHUB_ENV -Value "CCACHE_MAXSIZE=500M"
          # 不做"基于文件真实路径"的哈希：runner 的工作区路径每次一样，但保留这行更稳
          Add-Content -Path $env:GITHUB_ENV -Value "CCACHE_NOHASHDIR=true"
          # 时间宏忽略：本项目产物**不含 __DATE__/__TIME__**（CMakeLists 里已说明），
          # 忽略掉时间宏能让"同一份源码"跨天也能命中缓存。
          Add-Content -Path $env:GITHUB_ENV -Value "CCACHE_SLOPPINESS=time_macros,file_stat_matches"
          $cc = Join-Path $env:UCRT64_BIN 'ccache.exe'
          if (-not (Test-Path $cc)) { throw "找不到 ccache（$cc）——setup-ucrt64 装了吗？" }
          & $cc --version
          & $cc --show-stats
          Write-Output "CCACHE_DIR=$ccacheDir"
          $LASTEXITCODE = 0

      # 预设里的编译器路径写的是本地开发机的 A:\msys64，这里用命令行 -D 覆盖成 runner 的路径
      # （命令行 -D 优先于 preset 的 cacheVariables）
      - name: 配置（${{ matrix.config }}）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # ★ 早失败：UCRT64_BIN 没设好会让 CMakeCache 写成 CMAKE_MAKE_PROGRAM=/ninja.exe，
          #   一直到构建时才报 "build tool execution failed"（本地踩过，很难查）
          if (-not $env:UCRT64_BIN -or -not (Test-Path (Join-Path $env:UCRT64_BIN 'ninja.exe'))) {
            throw "UCRT64_BIN 没设好（当前='$env:UCRT64_BIN'）：「定位 UCRT64 工具链」那步失败了吗？"
          }
          # ★ GRT_WERROR=ON：把编译器告警当错误。本项目默认 OFF（本地开发友好），
          #   但 CI 必须当门禁——否则新告警会一直烂下去（曾经就烂过 2 条）。
          cmake --preset "ucrt64-${{ matrix.config == 'Debug' && 'debug' || 'release' }}" `
            -DCMAKE_MAKE_PROGRAM="$env:UCRT64_BIN/ninja.exe" `
            -DCMAKE_C_COMPILER="$env:UCRT64_BIN/gcc.exe" `
            -DCMAKE_CXX_COMPILER="$env:UCRT64_BIN/g++.exe" `
            -DCMAKE_RC_COMPILER="$env:UCRT64_BIN/windres.exe" `
            -DCMAKE_C_COMPILER_LAUNCHER="$env:UCRT64_BIN/ccache.exe" `
            -DCMAKE_CXX_COMPILER_LAUNCHER="$env:UCRT64_BIN/ccache.exe" `
            -DGRT_WERROR=ON
          if ($LASTEXITCODE -ne 0) { throw "配置失败（exit=$LASTEXITCODE）" }
          $LASTEXITCODE = 0

      - name: 构建
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg = "${{ matrix.config == 'Debug' && 'debug' || 'release' }}"
          # 导出表校验不能被静默跳过（objdump 必须在 PATH 上，见定位步骤）
          $line = Select-String -Path "build/$cfg/CMakeCache.txt" -Pattern '^GRT_OBJDUMP:' -ErrorAction SilentlyContinue
          if (-not $line -or $line.Line -match 'NOTFOUND') {
            throw "CMake 没找到 objdump → Shell DLL 导出表校验会被跳过（§2.3 要求 CI 必须执行）"
          }
          "objdump = $($line.Line)"
          cmake --build "build/$cfg" --parallel
          if ($LASTEXITCODE -ne 0) { throw "构建失败（exit=$LASTEXITCODE）" }
          # 缓存命中率（只是打印，不影响结论）：CI 提速要看这个数字
          $cc = Join-Path $env:UCRT64_BIN 'ccache.exe'
          if (Test-Path $cc) { & $cc --show-stats }
          $LASTEXITCODE = 0

      - name: CTest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ctest --test-dir "build/${{ matrix.config == 'Debug' && 'debug' || 'release' }}" --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "CTest 失败（exit=$LASTEXITCODE）" }
          $LASTEXITCODE = 0

      - name: GUI 自检（命令表 / 安全闸门 / AI 设置 / 远端与还原 / 执行后状态刷新 / 图标）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg = "${{ matrix.config == 'Debug' && 'debug' || 'release' }}"
          $out = Join-Path $PWD "build/selftest-gui-$cfg.txt"
          Remove-Item $out -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "build/$cfg/src/gui/GitRT.exe" `
                 -ArgumentList "--self-test=$out" -PassThru
          if (-not $p.WaitForExit(300000)) {
            $p.Kill()
            throw "GUI 自检超时（5 分钟没退出）"
          }
          if (Test-Path $out) { Get-Content $out } else { throw "GUI 自检没写出报告 $out" }
          $sum = Select-String -Path $out -Pattern '== 结果:' | Select-Object -Last 1
          if ($p.ExitCode -ne 0) { throw "GUI 自检失败（exit=$($p.ExitCode)）" }
          if (-not $sum -or $sum.Line -notmatch '== 结果: (\d+) 通过 / 0 失败 ==') {
            throw "GUI 自检没全绿：$(if ($sum) { $sum.Line } else { '没有结果行' })"
          }
          $LASTEXITCODE = 0

      - name: Shell 扩展自检 + 菜单树 dump
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg = "${{ matrix.config == 'Debug' && 'debug' || 'release' }}"
          $probe = "build/$cfg/src/shellprobe/GitRT.ShellProbe.exe"
          $dll   = "build/$cfg/src/shell/GitRT.Shell.dll"
          & $probe --self-test="build/selftest-shell-$cfg.txt" --dll $dll `
                   --identity packaging/identity.json `
                   --appx "build/$cfg/packaging/AppxManifest.xml" --workdir "build/$cfg"
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "Shell 自检失败（exit=$code）" }
          # ★ 先取到变量再截行（同上：直接管道给 Select-Object -Last 会改 $LASTEXITCODE）
          $dump = & $probe --dump $PWD --dll $dll
          $code = $LASTEXITCODE
          $dump | Select-Object -Last 15
          if ($code -ne 0) { throw "菜单 dump 失败（exit=$code）" }
          $LASTEXITCODE = 0

      # 功能套件：纯 CLI + 真 git 仓库的端到端（不弹窗口、不需要桌面会话），CI 里可以放心跑。
      # ★ 只在 Release 那一路跑：这四套是"命令行行为"的端到端，与构建类型无关，
      #   在 Debug/Release 各跑一遍等于把最慢的一段重复一次（CTest 与自检两个配置都跑，够覆盖 Debug 差异）。
      #   GUI 相关的 demo 脚本仍然只在本地按 README 跑。
      - name: 功能套件（远端与还原 / 合并提交 / 克隆选项）
        if: matrix.config == 'Release'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg = "${{ matrix.config == 'Debug' && 'debug' || 'release' }}"
          $exe = "build/$cfg/src/gui/GitRT.exe"
          $suites = @(
            @{ n = 'test-remote'; f = 'tools/test-remote.ps1' },
            @{ n = 'test-squash'; f = 'tools/test-squash.ps1' },
            @{ n = 'test-clone';  f = 'tools/test-clone.ps1'  },
            # 标签与发布（脚本存在才跑；gh 缺失时脚本自己 SKIP，不算失败）
            @{ n = 'test-tag-release'; f = 'tools/test-tag-release.ps1' }
          ) | Where-Object { Test-Path $_.f }
          $failed = @()
          foreach ($s in $suites) {
            "=== $($s.n) ==="
            & pwsh -NoProfile -File $s.f -Exe $exe *>&1 | Select-Object -Last 40
            if ($LASTEXITCODE -ne 0) { $failed += "$($s.n)(exit=$LASTEXITCODE)" }
          }
          if ($failed.Count -gt 0) { throw "功能套件失败：$($failed -join ', ')" }
          $LASTEXITCODE = 0

      # 关键产物：任何配置都要能跑，避免 Debug 通过 / Release 崩。
      # 注意这是**裸二进制**（开发/调试用），可发布的安装包在 package job 的 GitRT-release 里
      - name: 上传产物（${{ matrix.config }}）
        uses: actions/upload-artifact@v5
        with:
          name: gitrt-binaries-${{ matrix.config }}
          if-no-files-found: error
          path: |
            build/${{ matrix.config == 'Debug' && 'debug' || 'release' }}/src/gui/GitRT.exe
            build/${{ matrix.config == 'Debug' && 'debug' || 'release' }}/src/shell/GitRT.Shell.dll
            build/${{ matrix.config == 'Debug' && 'debug' || 'release' }}/src/shellprobe/GitRT.ShellProbe.exe
            build/${{ matrix.config == 'Debug' && 'debug' || 'release' }}/packaging/AppxManifest.xml
            build/selftest-gui-${{ matrix.config == 'Debug' && 'debug' || 'release' }}.txt
            build/selftest-shell-${{ matrix.config == 'Debug' && 'debug' || 'release' }}.txt

  package:
    name: package (release zip)
    needs: build
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      # ★ 这里**不再**重装 MSYS2、也不再重建 Release。
      #   build job 的 Release 那一路已经构建过，并把二进制 + 生成的 AppxManifest.xml 上传成
      #   gitrt-binaries-Release；package 只需要"组装 + 安装/卸载端到端"。
      #   已核实的依据：build-msix.ps1 -LayoutOnly 只要生成好的清单 + 源码 Assets
      #   （不需要编译器、不需要 Windows SDK）；build-release.ps1 用递归查找定位二进制。
      #   导出表 / 无运行时 DLL 依赖的校验仍留在 build job（那里才有 objdump）。
      - name: 下载 build job 的 Release 产物
        uses: actions/download-artifact@v5
        with:
          name: gitrt-binaries-Release
          path: build

      # download-artifact 的落地层级取决于 upload-artifact 算出的公共父目录（可能平铺、也可能带
      # 中间层），这里统一"归位"成打包脚本期望的 build/release/... 布局（幂等，已就位的不动）。
      - name: 产物归位（供打包脚本按本地构建布局取用）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem build -Recurse -File
          "下载到的文件（共 $($files.Count) 个）："
          $files | Select-Object -First 40 | ForEach-Object { "  $($_.FullName)" }
          pwsh -NoProfile -File packaging/scripts/stage-artifacts.ps1 -Config Release -OutDir build -SearchRoot build
          if ($LASTEXITCODE -ne 0) { throw "产物归位失败（exit=$LASTEXITCODE）" }
          $LASTEXITCODE = 0

      # ★ 版本号直接取【手动输入的 tag 号】（去掉前导 v）：发布包名字、exe 的 FileVersion
      #   与 GitHub Release 的 tag 必须是同一个版本，否则用户下到的包对不上发布。
      #   以前这里是「最新 tag + 0.0.1」自动推算，和手动 tag 会打架，已按用户要求改掉。
      - name: 计算版本（= 手动输入的 tag 号）
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = ($env:INPUT_TAG -as [string])
          if ([string]::IsNullOrWhiteSpace($tag)) { throw "没有 tag 号：手动触发时必须在 tag 输入框里填（例如 v1.2.3）" }
          $v = $tag.Trim() -replace '^[vV]', ''
          if ($v -notmatch '^\d+(\.\d+)+$') { throw "版本号不合法：[$tag]（要求形如 v1.2.3）" }
          Add-Content -Path $env:GITHUB_ENV -Value "GRT_VERSION=$v"
          "本次发布版本：$v（来自 tag $tag）"
          $LASTEXITCODE = 0


      - name: 组装发布包（app\ + package\ + install/uninstall 脚本 + zip）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File packaging/scripts/build-release.ps1 -Config Release -OutDir build -Version $env:GRT_VERSION
          if ($LASTEXITCODE -ne 0) { throw "打包失败（exit=$LASTEXITCODE）" }
          # 包里必须带 install/uninstall（用户装的入口）
          $hasInstall = Get-ChildItem "build/dist" -Recurse -Filter 'install.ps1' -ErrorAction SilentlyContinue
          $hasUninstall = Get-ChildItem "build/dist" -Recurse -Filter 'uninstall.ps1' -ErrorAction SilentlyContinue
          if (-not $hasInstall) { throw "发布目录里没有 install.ps1" }
          if (-not $hasUninstall) { throw "发布目录里没有 uninstall.ps1" }
          "install.ps1   : $($hasInstall[0].FullName)"
          "uninstall.ps1 : $($hasUninstall[0].FullName)"
          $LASTEXITCODE = 0

      # 真装到 <当前盘根>\gitRT、写注册表，再卸干净（用户要求的安装语义）
      - name: 安装/卸载端到端（pwd 盘根\gitRT + 注册表）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          "pwd=$PWD  盘根=$([IO.Path]::GetPathRoot($PWD.Path))  PS=$($PSVersionTable.PSVersion)"
          New-Item -ItemType Directory -Force -Path (Join-Path $PWD 'build') | Out-Null
          $log = Join-Path $PWD 'build/install-uninstall-e2e.txt'
          # ★ 直接跑并把输出写文件，**不要**接管道：接管道会把子进程输出吞掉，
          #   这步一旦失败日志里什么都看不到（踩过）
          & pwsh -NoProfile -File tools/test-install-uninstall.ps1 *> $log
          $code = $LASTEXITCODE
          Get-Content $log | Select-Object -Last 60
          if ($code -ne 0) { throw "install/uninstall 端到端失败（exit=$code，上面是输出末端）" }
          $LASTEXITCODE = 0

      - name: 显示发布目录
        shell: pwsh
        run: Get-ChildItem -Recurse -File build/dist | Select-Object FullName, Length

      - name: 上传发布包（zip + 安装脚本 + 可直接运行的 app 目录）
        uses: actions/upload-artifact@v5
        with:
          name: GitRT-release
          if-no-files-found: error
          path: |
            build/dist/*.zip
            build/dist/**/install.ps1
            build/dist/**/uninstall.ps1
            build/dist/**/app/*.exe
            build/dist/**/app/*.dll
            build/dist/**/package/AppxManifest.xml

  release:
    name: 发布（构建全部成功后才创建 tag 与 Release）
    # ★ 门禁：只有 build（Debug+Release 两个矩阵）与 package 都成功才走到这里。
    #   needs 的语义是"上游全部成功"；下面再显式写一遍 result 判断，
    #   是为了让"构建不成功就不 release"在 YAML 里显式可读、不依赖读者去理解 needs 语义。
    needs: [build, package]
    # 现在只有一条路径：手动触发 + 填了 tag 号。tag 由 CI 在所有构建成功之后创建/覆盖。
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.package.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.tag != ''
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 打 tag 需要完整历史/引用

      - name: 确定本次发布的 tag
        id: tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = ($env:INPUT_TAG -as [string])
          if ([string]::IsNullOrWhiteSpace($tag)) { throw "没有 tag 号：手动触发时必须在 tag 输入框里填（例如 v1.2.3）" }
          $tag = $tag.Trim()
          # 校验：必须是 v 开头 + 数字开头的版本号，避免"随手填了个奇怪的名字"
          if ($tag -notmatch '^v\d+\.\d+(\.\d+)*$') { throw "tag 号不合法：[$tag]（要求形如 v1.2.3）" }
          Add-Content -Path $env:GITHUB_ENV  -Value "GRT_RELEASE_TAG=$tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
          "本次发布 tag：$tag"
          $LASTEXITCODE = 0

      # ---- 打 tag：只有走到这里才说明构建已经全部成功 ----
      # ★ tag 已存在时**覆盖**（用户要求）：把远端同名 tag 强制指到本次 commit，
      #   否则"同名 tag 已存在"会让这次发布的产物对不上 tag（zip 是新的、tag 还指向旧提交）。
      - name: 创建或覆盖 tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GRT_RELEASE_TAG
          # ★ 必须显式给提交者身份：`git tag -a` 要写 tagger，而 GitHub runner 上
          #   actions/checkout **不会**配置 user.name/user.email —— 实测缺身份时
          #   `git tag -a` 直接报 "Committer identity unknown" (exit=128)。
          $actor = if ($env:GITHUB_ACTOR) { $env:GITHUB_ACTOR } else { 'github-actions' }
          & git config user.name  "$actor"
          & git config user.email "$actor@users.noreply.github.com"
          # 本地强制建（-f）：同名 tag 已存在时直接改成指向当前 commit
          & git tag -f -a $tag -m "GitRT $tag"
          if ($LASTEXITCODE -ne 0) { throw "创建本地 tag 失败（exit=$LASTEXITCODE）" }
          $target = (& git rev-parse "$tag^{commit}").Trim()
          "tag $tag -> $target"
          # 远端强制推（--force）：覆盖已存在的同名 tag
          & git push --force origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "推送 tag 失败（exit=$LASTEXITCODE）" }
          "已推送（必要时覆盖）tag $tag"
          $LASTEXITCODE = 0

      - name: 下载发布包
        uses: actions/download-artifact@v5
        with:
          name: GitRT-release
          path: dist

      - name: 创建或覆盖 GitHub Release 并附上 zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GRT_RELEASE_TAG
          $zip = Get-ChildItem dist -Recurse -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "没有找到发布 zip" }
          # ★ 覆盖语义（用户要求）：同名 Release 已存在时**先删再建**，
          #   这样标题、说明（--generate-notes）与资产都是本次构建的，不会出现
          #   "资产是新的、说明还是上一次的"这种半覆盖状态。
          #   不加 --cleanup-tag：tag 由上一步自己管理（已强制指向本次 commit）。
          & gh release view "$tag" --json tagName 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            "Release $tag 已存在 → 删除后重建（覆盖）"
            & gh release delete "$tag" --yes
            if ($LASTEXITCODE -ne 0) { throw "删除旧 Release 失败（exit=$LASTEXITCODE）" }
          }
          & gh release create "$tag" $zip.FullName --title "GitRT $tag" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "创建 Release 失败（exit=$LASTEXITCODE）" }
          "已发布：$tag"
          $LASTEXITCODE = 0
